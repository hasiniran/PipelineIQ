spring.application.name=pipelineiq
spring.main.web-application-type=none

# Base URL where Ollama is running locally (default port is 11434)
spring.ai.ollama.base-url=http://localhost:11434

# Specify the model you want to use (e.g., llama3.1, mistral, gemma2)
spring.ai.ollama.chat.options.model=llama3.1

# Optional: Adjust the temperature for more deterministic analysis
spring.ai.ollama.chat.options.temperature=0.1