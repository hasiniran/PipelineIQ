name: 'PipelineIQ'
description: 'Privacy-First AI log analysis'
author: 'Hasini'

inputs:
  log-path:
    required: true
    description: 'Path to the failed log file'
  llm-provider:
    required: false
    default: 'openai'
    description: 'AI provider to use (openai or ollama)'
  api-key:
    required: false
    description: 'API key for cloud mode'
  ollama-url:
    required: false
    default: 'http://localhost:11434'
    description: 'URL for local Ollama instance'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    PIPELINEIQ_PROVIDER: ${{ inputs.llm-provider }}
    OPENAI_API_KEY: ${{ inputs.api-key }}
    SPRING_AI_OLLAMA_BASE_URL: ${{ inputs.ollama-url }}
  args:
    - ${{ inputs.log-path }}
